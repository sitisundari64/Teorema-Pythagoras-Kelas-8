  <script>
    const initialQuestions = [

      { q: "Segitiga dengan panjang sisi 6 cm, 8 cm, dan 10 cm adalah ...", o: ["segitiga sama sisi", "segitiga siku-siku", "segitiga tumpul", "segitiga lancip"], a: 1 },
      { q: "Teorema Pythagoras dapat digunakan untuk mencari ...", o: ["keliling lingkaran", "panjang sisi segitiga siku-siku", "luas trapesium saja", "besar sudut semua bangun"], a: 1 }
    ];

    const hotsQuestions = [
      { q: "Sebuah tangga panjangnya 10 m bersandar pada dinding. Kaki tangga 6 m dari dinding. Tinggi yang dicapai tangga adalah ...", o: ["4 m", "6 m", "8 m", "16 m"], a: 2, e: "Gunakan tinggi² = 10² − 6² = 100 − 36 = 64, sehingga tingginya 8 m." },
      { q: "Sebuah taman berbentuk persegi panjang berukuran 9 m × 12 m. Jarak terpendek dari satu sudut ke sudut berseberangan adalah ...", o: ["15 m", "18 m", "21 m", "108 m"], a: 0, e: "Diagonal taman = √(9² + 12²) = √225 = 15 m." },
      { q: "Manakah yang merupakan tripel Pythagoras?", o: ["4, 5, 6", "5, 6, 7", "7, 24, 25", "8, 10, 12"], a: 2, e: "7² + 24² = 49 + 576 = 625 = 25²." },
      { q: "Sebuah kabel 13 m menghubungkan puncak tiang dengan tanah. Jika jarak titik kabel di tanah ke tiang 5 m, tinggi tiang adalah ...", o: ["8 m", "10 m", "12 m", "18 m"], a: 2, e: "Tinggi² = 13² − 5² = 169 − 25 = 144. Tinggi = 12 m." },

      { q: "Segitiga dengan sisi 10 cm, 24 cm, dan 26 cm diklasifikasikan sebagai ...", o: ["siku-siku", "lancip", "tumpul", "sama kaki"], a: 0, e: "10² + 24² = 100 + 576 = 676 = 26², maka segitiga siku-siku." },
      { q: "Rute A ke B 8 km ke timur dan B ke C 15 km ke utara. Jarak lurus A ke C adalah ...", o: ["17 km", "23 km", "120 km", "7 km"], a: 0, e: "Jarak lurus = √(8² + 15²) = √289 = 17 km." },
      { q: "Jika hipotenusa segitiga siku-siku 25 cm dan satu sisi lainnya 7 cm, sisi siku-siku yang belum diketahui adalah ...", o: ["18 cm", "20 cm", "24 cm", "32 cm"], a: 2, e: "Sisi² = 25² − 7² = 625 − 49 = 576. Sisi = 24 cm." },
      { q: "Mengapa sisi terpanjang harus dijadikan c dalam rumus Pythagoras?", o: ["Karena c selalu alas", "Karena c adalah sisi miring", "Karena c selalu lebih pendek", "Karena c tidak perlu dikuadratkan"], a: 1, e: "Pada segitiga siku-siku, c menyatakan hipotenusa, yaitu sisi terpanjang di depan sudut siku-siku." },
      { q: "Sebuah layar berbentuk persegi panjang memiliki panjang 16 cm dan diagonal 20 cm. Lebarnya adalah ...", o: ["4 cm", "8 cm", "12 cm", "36 cm"], a: 2, e: "Lebar² = 20² − 16² = 400 − 256 = 144. Lebar = 12 cm." }
    ];

    const finalQuestions = [
      { q: "Sebuah persegi panjang memiliki ukuran 20 cm × 21 cm. Diagonalnya adalah ...", o: ["29 cm", "31 cm", "41 cm", "420 cm"], a: 0, e: "√(20² + 21²) = √841 = 29 cm." },
      { q: "Panjang sisi miring segitiga dengan kaki 9 cm dan 40 cm adalah ...", o: ["41 cm", "49 cm", "31 cm", "1600 cm"], a: 0, e: "√(9² + 40²) = √1681 = 41 cm." },
      { q: "Sebuah layang-layang memiliki diagonal saling tegak lurus. Jika setengah diagonalnya 5 cm dan 12 cm, sisi layang-layang adalah ...", o: ["13 cm", "17 cm", "7 cm", "60 cm"], a: 0, e: "Bagian layang-layang membentuk segitiga siku-siku 5-12-13." },
      { q: "Sisi 11 cm, 60 cm, dan 61 cm membentuk segitiga ...", o: ["siku-siku", "lancip", "tumpul", "sama sisi"], a: 0, e: "11² + 60² = 121 + 3600 = 3721 = 61²." },
      { q: "Sebuah kapal bergerak 12 km ke selatan lalu 16 km ke timur. Jarak terpendek dari titik awal adalah ...", o: ["20 km", "28 km", "4 km", "192 km"], a: 0, e: "√(12² + 16²) = √400 = 20 km." },
      { q: "Jika c = 15 dan a = 9 pada segitiga siku-siku, nilai b adalah ...", o: ["6", "12", "18", "24"], a: 1, e: "b² = 15² − 9² = 225 − 81 = 144, sehingga b = 12." },
      { q: "Diagonal sebuah kotak 26 cm dan salah satu sisinya 10 cm. Sisi lainnya adalah ...", o: ["16 cm", "24 cm", "36 cm", "20 cm"], a: 1, e: "√(26² − 10²) = √576 = 24 cm." },
      { q: "Seorang petugas memasang kabel dari puncak tiang 35 m ke titik 12 m dari kaki tiang. Panjang kabel minimum adalah ...", o: ["37 m", "47 m", "23 m", "420 m"], a: 0, e: "√(35² + 12²) = √1369 = 37 m." },
      { q: "Manakah pasangan sisi yang TIDAK membentuk segitiga siku-siku?", o: ["8, 15, 17", "12, 16, 20", "6, 8, 11", "20, 21, 29"], a: 2, e: "6² + 8² = 100, sedangkan 11² = 121, sehingga bukan segitiga siku-siku." },
      { q: "Lantai ruangan 24 m × 32 m akan dipasang kabel diagonal. Kabel minimal yang diperlukan adalah ...", o: ["40 m", "56 m", "768 m", "8 m"], a: 0, e: "√(24² + 32²) = √1600 = 40 m." }
    ];

    let learnedSections = new Set();
    let audioContext, musicInterval, musicOn = false, quizInterval, quizSeconds = 600;

    function showPage(id) {
      document.querySelectorAll('.page-view').forEach(page => page.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      learnedSections.add(id);
      updateLearningProgress();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (id === 'kuis') startQuizTimer();
      else stopQuizTimer();
    }

    function updateLearningProgress() {
      const meaningful = ['apersepsi', 'awal', 'materi', 'aktivitas', 'kuis', 'akhir', 'refleksi'];
      const percent = Math.round((meaningful.filter(x => learnedSections.has(x)).length / meaningful.length) * 100);
      document.getElementById('headerProgressText').textContent = percent + '%';
      document.getElementById('homeProgressBar').style.width = percent + '%';
    }

    function renderQuestionSet(targetId, questions, progressId) {
      const target = document.getElementById(targetId);
      target.innerHTML = questions.map((item, i) => `
        <article class="question-item ${i === 0 ? '' : 'hidden'}" data-index="${i}">
          <div class="flex items-center justify-between gap-3 mb-4">
            <span class="px-3 py-1 rounded-full text-sm font-bold bg-sky-100 text-sky-800">Soal ${i + 1} dari ${questions.length}</span>
            <span class="text-sm font-bold text-slate-500">${Math.round(((i + 1) / questions.length) * 100)}%</span>
          </div>
          <h3 class="text-xl font-bold leading-relaxed">${item.q}</h3>
          <div class="space-y-3 mt-5">
            ${item.o.map((option, oi) => `<button type="button" class="answer-btn" data-answer="${oi}" onclick="selectAnswer(this, '${targetId}', ${i}, '${progressId || ''}')"><span class="inline-grid place-items-center w-7 h-7 mr-2 rounded-full bg-sky-100 text-sky-800">${String.fromCharCode(65 + oi)}</span>${option}</button>`).join('')}
          </div>
          <div class="flex justify-between mt-6">
            <button type="button" class="btn-outline ${i === 0 ? 'invisible' : ''}" onclick="moveQuestion('${targetId}', ${i}, -1, '${progressId || ''}')"><i data-lucide="arrow-left"></i> Sebelumnya</button>
            <button type="button" class="btn-primary ${i === questions.length - 1 ? 'invisible' : ''}" onclick="moveQuestion('${targetId}', ${i}, 1, '${progressId || ''}')">Berikutnya <i data-lucide="arrow-right"></i></button>
          </div>
        </article>
      `).join('');
      if (progressId) document.getElementById(progressId).style.width = '10%';
      lucide.createIcons();
    }

    function selectAnswer(button, targetId, index, progressId) {
      const article = button.closest('.question-item');
      article.querySelectorAll('.answer-btn').forEach(btn => btn.classList.remove('selected'));
      button.classList.add('selected');
      if (progressId) {
        const count = [...document.querySelectorAll('#' + targetId + ' .answer-btn.selected')].length;
        const total = document.querySelectorAll('#' + targetId + ' .question-item').length;
        document.getElementById(progressId).style.width = Math.max(((count / total) * 100), 10) + '%';
      }
    }

    function moveQuestion(targetId, index, direction, progressId) {
      const all = [...document.querySelectorAll('#' + targetId + ' .question-item')];
      all[index].classList.add('hidden');
      all[index + direction].classList.remove('hidden');
      if (progressId) document.getElementById(progressId).style.width = ((index + direction + 1) / all.length * 100) + '%';
      lucide.createIcons();
    }

    function gradeSet(targetId, questions) {
      let correct = 0;
      document.querySelectorAll('#' + targetId + ' .question-item').forEach((article, i) => {
        const selected = article.querySelector('.answer-btn.selected');
        article.querySelectorAll('.answer-btn').forEach((button, oi) => {
          button.disabled = true;
          if (oi === questions[i].a) button.classList.add('correct');
          else if (selected === button) button.classList.add('incorrect');
        });
        if (selected && Number(selected.dataset.answer) === questions[i].a) correct++;
      });
      return Math.round((correct / questions.length) * 100);
    }

    function renderInitial() {
      renderQuestionSet('initialQuiz', initialQuestions);
      document.getElementById('initialResult').classList.add('hidden');
      document.getElementById('initialSubmit').disabled = false;
    }

    function gradeInitial() {
      const score = gradeSet('initialQuiz', initialQuestions);
      const result = document.getElementById('initialResult');
      result.classList.remove('hidden');
      result.innerHTML = `<strong>Skor awalmu: ${score}/100.</strong><br>${score >= 80 ? 'Hebat! Kamu sudah memiliki bekal kuat. Lanjutkan untuk memperdalam penerapan konsepnya.' : 'Bagus, ini adalah titik awalmu. Pelajari materi dengan santai—kesalahan adalah bagian penting dari proses bertumbuh!'}`;
      document.getElementById('initialSubmit').disabled = true;
      learnedSections.add('awal'); updateLearningProgress();
    }

    function renderQuiz() {
      stopQuizTimer();
      quizSeconds = 600;
      renderQuestionSet('quizArea', hotsQuestions, 'quizProgress');
      document.getElementById('quizFeedback').classList.add('hidden');
      document.getElementById('quizSubmit').disabled = false;
      updateTimer();
      startQuizTimer();
    }

    function gradeQuiz() {
      stopQuizTimer();
      const score = gradeSet('quizArea', hotsQuestions);
      const feedback = document.getElementById('quizFeedback');
      feedback.classList.remove('hidden');
      feedback.innerHTML = `<h3 class="text-xl font-extrabold">Skor Kuis: ${score}/100</h3><p class="mt-2">${score >= 90 ? 'Luar biasa! Strategi berpikirmu sudah sangat kuat.' : 'Terus bertumbuh! Baca pembahasan pada setiap soal dan coba lagi untuk memperkuat strategimu.'}</p><div class="mt-4 space-y-2">${hotsQuestions.map((x, i) => `<p><strong>${i + 1}.</strong> ${x.e}</p>`).join('')}</div>`;
      document.getElementById('quizSubmit').disabled = true;
      if (score >= 90) launchConfetti();
      learnedSections.add('kuis'); updateLearningProgress();
    }

    function renderFinal() {
      renderQuestionSet('finalQuiz', finalQuestions, 'finalProgress');
      document.getElementById('finalResult').classList.add('hidden');
      document.getElementById('badgeAward').classList.remove('show');
    }

    function gradeFinal() {
      const score = gradeSet('finalQuiz', finalQuestions);
      let predicate = score >= 90 ? 'Sangat Baik' : score >= 80 ? 'Baik' : score >= 70 ? 'Cukup' : 'Perlu Bimbingan';
      const result = document.getElementById('finalResult');
      result.classList.remove('hidden');
      result.innerHTML = `<div class="soft-panel p-6"><p class="text-sm font-bold text-sky-700">NILAI AKHIR</p><p class="display-font text-6xl font-bold text-sky-800 mt-1">${score}</p><p class="text-xl font-extrabold mt-2">Predikat: ${predicate}</p><p class="mt-3 text-slate-600 dark:text-slate-200">${score >= 70 ? 'Selamat! Kamu telah menyelesaikan perjalanan belajar Teorema Pythagoras.' : 'Jangan menyerah. Ulangi materi dan tantang dirimu kembali—kemampuanmu dapat berkembang melalui latihan.'}</p></div><div class="mt-4 text-sm leading-relaxed">${finalQuestions.map((x, i) => `<p><strong>${i + 1}.</strong> ${x.e}</p>`).join('')}</div>`;
      if (score >= 90) { document.getElementById('badgeAward').classList.add('show'); launchConfetti(); }
      learnedSections.add('akhir'); updateLearningProgress();
    }

    const matchingPairs = [
      { id: 'a', text: '3, 4, 5', type: 'triple' }, { id: 'a', text: 'Tripel Pythagoras paling dikenal', type: 'meaning' },
      { id: 'b', text: 'Hipotenusa', type: 'triple' }, { id: 'b', text: 'Sisi di depan sudut siku-siku', type: 'meaning' },
      { id: 'c', text: 'a² + b² = c²', type: 'triple' }, { id: 'c', text: 'Rumus Teorema Pythagoras', type: 'meaning' },
      { id: 'd', text: '5, 12, 13', type: 'triple' }, { id: 'd', text: 'Contoh tripel Pythagoras', type: 'meaning' }
    ];
    let selectedMatch = null;

    function renderMatching() {
      selectedMatch = null;
      const mixed = [...matchingPairs].sort(() => Math.random() - .5);
      document.getElementById('matchingBoard').innerHTML = mixed.map((item, i) => `<button type="button" class="match-card" data-pair="${item.id}" onclick="selectMatch(this)">${item.text}</button>`).join('');
      document.getElementById('matchFeedback').classList.add('hidden');
    }

    function selectMatch(button) {
      if (!selectedMatch) {
        selectedMatch = button;
        button.classList.add('selected');
        return;
      }
      if (selectedMatch === button) return;
      const feedback = document.getElementById('matchFeedback');
      feedback.classList.remove('hidden');
      if (selectedMatch.dataset.pair === button.dataset.pair) {
        selectedMatch.classList.remove('selected');
        selectedMatch.classList.add('matched');
        button.classList.add('matched');
        feedback.className = 'mt-5 p-4 rounded-xl font-semibold bg-emerald-100 text-emerald-800';
        feedback.textContent = 'Cocok! Kamu berhasil menghubungkan konsep dengan tepat. Teruskan, ya!';
      } else {
        selectedMatch.classList.remove('selected');
        feedback.className = 'mt-5 p-4 rounded-xl font-semibold bg-yellow-100 text-yellow-900';
        feedback.textContent = 'Belum cocok, tetapi kamu sedang belajar. Amati kembali kata kunci pada kedua kartu lalu coba lagi!';
      }
      selectedMatch = null;
      if (document.querySelectorAll('.match-card.matched').length === matchingPairs.length) {
        learnedSections.add('aktivitas'); updateLearningProgress();
      }
    }

    function updateTimer() {
      const min = Math.floor(quizSeconds / 60);
      const sec = quizSeconds % 60;
      document.getElementById('quizTimer').textContent = String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    }
    function startQuizTimer() {
      stopQuizTimer();
      quizInterval = setInterval(() => {
        if (quizSeconds > 0) { quizSeconds--; updateTimer(); }
        else { stopQuizTimer(); gradeQuiz(); }
      }, 1000);
    }
    function stopQuizTimer() { if (quizInterval) clearInterval(quizInterval); }

    function launchConfetti() {
      const colors = ['#3491d4', '#ffd434', '#2dbfb1', '#ff746c', '#ffffff'];
      for (let i = 0; i < 70; i++) {
        const piece = document.createElement('span');
        piece.className = 'confetti';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = Math.random() * .6 + 's';
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 3600);
      }
    }

    function toggleMusic() {
      const button = document.getElementById('musicButton');
      if (!musicOn) {
        audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        const notes = [261.63, 329.63, 392, 329.63, 293.66, 369.99, 440, 369.99];
        let index = 0;
        const playNote = () => {
          if (!musicOn) return;
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = 'sine'; osc.frequency.value = notes[index++ % notes.length];
          gain.gain.setValueAtTime(.035, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + .45);
          osc.connect(gain); gain.connect(audioContext.destination);
          osc.start(); osc.stop(audioContext.currentTime + .48);
        };
        playNote(); musicInterval = setInterval(playNote, 550);
        musicOn = true; button.innerHTML = '<i data-lucide="volume-x"></i>'; button.setAttribute('aria-label', 'Matikan musik');
      } else {
        clearInterval(musicInterval); musicOn = false; button.innerHTML = '<i data-lucide="volume-2"></i>'; button.setAttribute('aria-label', 'Nyalakan musik');
      }
      lucide.createIcons();
    }

    function saveReflection(event) {
      event.preventDefault();
      const message = document.getElementById('reflectionMessage');
      message.textContent = 'Refleksimu sudah siap. Bagikan jawabanmu kepada guru atau teman diskusimu.';
      message.classList.remove('hidden');
      learnedSections.add('refleksi'); updateLearningProgress();
    }

    document.getElementById('musicButton').addEventListener('click', toggleMusic);
    document.getElementById('themeButton').addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      document.getElementById('themeButton').innerHTML = isDark ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
      lucide.createIcons();
    });

    renderInitial();
    renderMatching();
    renderQuiz();
    renderFinal();
    stopQuizTimer();
    lucide.createIcons();
  </script>
 </body>
</html>
